name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  shellcheck:
    name: ShellCheck all scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: |
          shellcheck -x -S warning $(find . -name "*.sh" -not -path "./.git/*")

  compose-validate:
    name: Validate docker-compose.yml parses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -c "import yaml; yaml.safe_load(open('compose/docker-compose.yml'))"

  bridge-syntax:
    name: Compile-check bridges & layers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: py_compile all bridges and layers
        run: |
          python3 -m py_compile compose/bridge/bridges/*.py compose/bridge/layers/*.py

  zenoh-admin-frontend:
    name: zenoh-admin UI type-check + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: compose/zenoh-admin/ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install -g pnpm
      - run: pnpm install
      - run: pnpm type-check
      - run: pnpm build

  docker-build:
    name: Docker image builds
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: bridge
            context: compose/bridge
          - name: zenoh-admin
            context: compose/zenoh-admin
    steps:
      - uses: actions/checkout@v4
      - name: Build ${{ matrix.name }} image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: false
