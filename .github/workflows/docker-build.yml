name: docker-build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  docker-build:
    name: Docker image builds
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: bridge
            context: compose
          - name: zenoh-admin
            context: compose/zenoh-admin
    steps:
      - uses: actions/checkout@v6
      - name: Build ${{ matrix.name }} image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          push: false
