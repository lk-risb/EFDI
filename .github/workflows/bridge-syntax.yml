name: bridge-syntax

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  bridge-syntax:
    name: Compile-check bridges & layers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile bridge, layer, and protocol modules
        run: |
          python3 -m compileall -q compose/bridges compose/c2 compose/protocols compose/layers
      - name: Verify launcher service paths resolve
        run: |
          python3 tools/check_service_paths.py
      - name: Compile all Protobuf contracts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq protobuf-compiler
          while IFS= read -r protocol; do
            schema="${protocol%.py}.proto"
            test -f "$schema" || { echo "Missing matching schema: $schema"; exit 1; }
          done < <(
            find compose/protocols/random compose/protocols/vendors \
              -type f -name '*.py' -not -path '*/__pycache__/*' -print |
              sort
          )
          mapfile -t schemas < <(
            find compose/protocols -type f -name '*.proto' -print | sort
          )
          test "${#schemas[@]}" -gt 0
          protoc -I compose \
            --descriptor_set_out=/tmp/efdi-protocols.pb \
            --include_imports \
            "${schemas[@]}"
