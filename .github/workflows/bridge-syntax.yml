name: bridge-syntax

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  bridge-syntax:
    name: Compile-check bridges & layers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: py_compile all bridges and layers
        run: |
          python3 -m py_compile compose/bridge/bridges/*.py compose/bridge/layers/*.py
