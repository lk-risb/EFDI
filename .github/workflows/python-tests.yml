name: python-tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-tests:
    name: Python tests and compile checks
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4.12-noble@sha256:a794d9eb009e20de605858a11f32f63b4075cbd197c650436f0e3b457e4caed7
        env:
          MARIADB_ROOT_PASSWORD: test-root-password
          MARIADB_DATABASE: admin
          MARIADB_USER: test
          MARIADB_PASSWORD: test-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime dependencies
        run: python -m pip install -r compose/requirements.txt -r compose/zenoh-admin/requirements.txt pytest
      - name: Run tests
        env:
          PYTHONPATH: compose/generated:compose/generated/protocols:compose
          EFDI_TEST_MARIADB: "1"
          ZENOH_ADMIN_DB_ADDRESS: 127.0.0.1:3306
          ZENOH_ADMIN_DB_USER: test
          ZENOH_ADMIN_DB_PASSWORD: test-password
        run: |
          EFDI_PROTOC_PYTHON=python scripts/generate-protobuf.sh
          python -m pytest -q tests
      - name: Compile bridge, layer, and admin modules
        run: python -m compileall -q compose/bridges compose/protocols compose/layers compose/zenoh-admin/api compose/admin_control.py
  zenoh-loopback:
    name: Zenoh identity and ACL loopback
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install eclipse-zenoh==1.9.0
      - run: docker pull eclipse/zenoh:1.9.0
      - name: Prove scoped delivery, identity AND semantics, quarantine, and expiry
        env:
          EFDI_ZENOH_PYTHON: python
        run: tests/smoke/loopback.sh
      - name: Prove root-child-grandchild scope, isolation, and recovery
        env:
          EFDI_ZENOH_PYTHON: python
        run: tests/smoke/managed-three-router.sh
