name: zenoh-admin-frontend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  zenoh-admin-frontend:
    name: zenoh-admin UI type-check + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: compose/zenoh-admin/ui
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: compose/zenoh-admin/ui/pnpm-lock.yaml
      - run: npm install -g pnpm@11.9.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm type-check
      - run: pnpm build
