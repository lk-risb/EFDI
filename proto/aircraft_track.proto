syntax = "proto3";

package ltu.cis.tracks.v1;

// Live aircraft position from OpenSky Network (opensky_states_bridge.py).
// Current JSON topic: <PREFIX>/<ORG>/air/opensky/adsb/civ/aircraft/tracks/v1
// Field names map timestamp/source to the Python track keys _ts/_src.
message AircraftTrack {
  double timestamp     = 1;  // Unix epoch when record was created locally
  string source        = 2;  // "opensky"
  optional string icao24 = 3;  // ICAO 24-bit transponder address (hex)
  optional string callsign = 4;  // Flight callsign, e.g. "DLH123"
  optional string origin_country = 5; // Country of registration
  double lat_deg       = 6;  // WGS-84 latitude in decimal degrees
  double lon_deg       = 7;  // WGS-84 longitude in decimal degrees
  optional double baro_alt_m = 8;  // Barometric altitude in metres
  optional double geo_alt_m = 9;  // Geometric WGS-84 altitude in metres
  optional double speed_ms = 10; // Ground speed in m/s
  optional double heading_deg = 11; // True track, degrees clockwise from north
  optional double vertical_rate_ms = 12; // Positive = climbing
  optional bool on_ground = 13;
  optional string squawk = 14; // Mode A code, e.g. "7700"
  optional string pos_source = 15; // "ADS-B", "ASTERIX", "MLAT", or "FLARM"
  optional int64 time_position = 16; // Source position timestamp, Unix epoch
}
