syntax = "proto3";

package ltu.cis.tracks.v1;

// ASTERIX CAT62 System Track from radar (cat62_bridge.py)
// Published to: <YOUR_NAMESPACE>/radar/<radar-host>/tracks/v1
// JSON wire format: key _ts → timestamp; only decoded fields are present (compound
// I062 items 10/12/15/16/17/19-25 are skipped — remaining fields abort on first compound).
// Zero value means "not present/decoded" for numeric optional fields.
message Cat62Track {
  double timestamp        = 1;  // Unix epoch when frame was decoded locally (_ts)
  uint32 sac              = 2;  // System Area Code — I062/010 byte 0
  uint32 sic              = 3;  // System Identification Code — I062/010 byte 1
  uint32 service_id       = 4;  // Service Identification — I062/015
  double time_utc_s       = 5;  // Seconds since 00:00 UTC, LSB = 1/128 s — I062/070
  double lat_deg          = 6;  // WGS-84 latitude, LSB = 180/2^25 deg — I062/105
  double lon_deg          = 7;  // WGS-84 longitude, LSB = 180/2^25 deg — I062/105
  double x_m              = 8;  // Cartesian X in metres, LSB = 0.5 m — I062/100
  double y_m              = 9;  // Cartesian Y in metres, LSB = 0.5 m — I062/100
  double vx_ms            = 10; // Cartesian velocity Vx in m/s, LSB = 0.25 — I062/185
  double vy_ms            = 11; // Cartesian velocity Vy in m/s, LSB = 0.25 — I062/185
  double speed_ms         = 12; // Derived ground speed |V| = hypot(vx, vy) in m/s
  double heading_deg      = 13; // Derived heading from atan2(vx,vy), degrees CW from N
  double ax_ms2           = 14; // Acceleration X in m/s², LSB = 0.25 — I062/210
  double ay_ms2           = 15; // Acceleration Y in m/s², LSB = 0.25 — I062/210
  string mode3a           = 16; // Mode 3/A squawk in octal, e.g. "7700" — I062/060
  uint32 track_num        = 17; // System track number (12-bit) — I062/040
  string track_status_hex = 18; // Raw I062/080 Track Status bytes as hex string
  bool   track_confirmed  = 19; // True when CNF=0 in I062/080 (confirmed track)
  double measured_fl      = 20; // Measured flight level in FL units, LSB=0.25 — I062/136
  int32  calc_alt_ft      = 21; // Calculated altitude in feet, LSB=25 ft — I062/130
}
