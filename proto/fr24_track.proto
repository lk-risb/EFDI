syntax = "proto3";

package ltu.cis.tracks.v1;

// Live aircraft position from FlightRadar24 API (fr24_live_bridge.py).
// Current JSON topic: <PREFIX>/<ORG>/air/fr24/adsb/civ/aircraft/tracks/v1
// Field names map timestamp/source to the Python track keys _ts/_src.
message Fr24Track {
  double timestamp       = 1;  // Unix epoch when fetched (_ts)
  string source          = 2;  // "fr24" (_src)
  optional string fr24_id = 3;  // FR24 internal flight ID
  optional string callsign = 4;  // ATC callsign, e.g. "AFL1234"
  optional string registration = 5;  // Aircraft registration, e.g. "LY-BOA"
  optional string aircraft_type = 6;  // ICAO type code, e.g. "B738"
  double lat_deg         = 7;  // WGS-84 latitude
  double lon_deg         = 8;  // WGS-84 longitude
  optional int32 alt_ft = 9;  // Reported altitude, feet
  optional int32 speed_kts = 10; // Ground speed, knots
  optional int32 heading_deg = 11; // True track, degrees clockwise from N
  optional bool on_ground = 12;
  optional string painted_as = 13; // Airline/livery ICAO code
  optional string operating_as = 14; // Operating carrier ICAO code
  optional string squawk = 15; // Mode A code
}
