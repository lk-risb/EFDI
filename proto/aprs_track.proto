syntax = "proto3";

package ltu.cis.tracks.v1;

// APRS position record from APRS-IS (aprs_bridge.py)
// Published to: 1851281db70ccc0409dad4ecfc874cf5/aprs/aprs-is/tracks/v1
// Source: rotate.aprs2.net:14580 (filtered), filter r/55.17/23.88/500 (Baltic, 500 km)
// JSON wire format: keys _ts → timestamp, _src → source; all other keys match field names.
// Zero value means "not present" for numeric optional fields.
message AprsTrack {
  double timestamp   = 1;  // Unix epoch when packet was received locally (_ts)
  string source      = 2;  // "aprs-is" (_src)
  string callsign    = 3;  // APRS station callsign, e.g. "LY1ABC-9"
  string path        = 4;  // Digipeater path, e.g. "WIDE1-1,WIDE2-2"
  double lat_deg     = 5;  // WGS-84 latitude in decimal degrees
  double lon_deg     = 6;  // WGS-84 longitude in decimal degrees
  string symbol      = 7;  // 2-char APRS symbol (table+code), e.g. "/>" = car
  double heading_deg = 8;  // Course in degrees clockwise from north (0 if absent)
  double speed_ms    = 9;  // Ground speed in m/s, converted from knots (0 if absent)
  double alt_m       = 10; // Altitude in metres, converted from feet (0 if absent)
  string comment     = 11; // Free-text comment from APRS packet (may be empty)
}
