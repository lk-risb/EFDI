syntax = "proto3";

package ltu.cis.tracks.v1;

// Wind and weather forecast point from Windy Point Forecast API (windy_bridge.py)
// Published to: <ORG>/weather/windy/<place>/forecast/v1
// JSON keys _ts → timestamp, _src → source.
// Windy returns temperature in Kelvin and pressure in Pa — converted to °C and hPa here.
// Upper-level fields (850h, 300h) are 0 when not requested or unavailable.
message WindyForecast {
  double timestamp      = 1;  // Unix epoch when fetched (_ts)
  string source         = 2;  // "windy" (_src)
  string place_name     = 3;  // Configured place slug, e.g. "vilnius"
  string model          = 4;  // NWP model: "gfs", "ecmwf", "icon", "geos5", etc.
  double lat_deg        = 5;  // WGS-84 latitude of the forecast point
  double lon_deg        = 6;  // WGS-84 longitude
  string time_utc       = 7;  // ISO-8601 UTC of the forecast step
  // Surface (10 m) winds
  double wind_u_ms      = 8;  // Eastward wind component, m/s
  double wind_v_ms      = 9;  // Northward wind component, m/s
  double wind_speed_ms  = 10; // Derived |wind| at surface, m/s
  double wind_dir_deg   = 11; // Derived direction wind comes FROM, degrees
  // Surface conditions
  double temp_c         = 12; // 2 m temperature, °C (converted from K)
  double pressure_hpa   = 13; // Surface pressure, hPa (converted from Pa)
  double rh_pct         = 14; // Relative humidity at surface, %
  double dewpoint_c     = 15; // Dewpoint, °C (converted from K)
  // 850 hPa level (~1500 m) — relevant for low-altitude aviation / UAVs
  double wind_u_850h_ms = 16;
  double wind_v_850h_ms = 17;
  double temp_850h_c    = 18;
  // 300 hPa level (~9000 m) — jet stream / high-altitude aviation
  double wind_u_300h_ms = 19;
  double wind_v_300h_ms = 20;
}
