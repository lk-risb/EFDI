syntax = "proto3";

package ltu.cis.tracks.v1;

// Ocean/sea state observation from Copernicus Marine Service (cmems_bridge.py)
// Published to: <ORG>/ocean/cmems/<dataset-id>/v1
// JSON keys _ts → timestamp, _src → source. Zero means "not present" for numerics.
message OceanPoint {
  double timestamp                  = 1;  // Unix epoch when fetched (_ts)
  string source                     = 2;  // "cmems" (_src)
  string dataset_id                 = 3;  // CMEMS product/dataset ID
  double lat_deg                    = 4;  // WGS-84 latitude of the grid point
  double lon_deg                    = 5;  // WGS-84 longitude of the grid point
  string time_utc                   = 6;  // ISO-8601 UTC of the model analysis/forecast time
  double sea_surface_temperature_c  = 7;  // SST, °C (thetao at surface)
  double sea_surface_salinity_psu   = 8;  // Salinity, PSU (so at surface)
  double eastward_current_ms        = 9;  // Eastward sea water velocity, m/s (uo)
  double northward_current_ms       = 10; // Northward sea water velocity, m/s (vo)
  double significant_wave_height_m  = 11; // Hs, m (VHM0)
  double mean_wave_period_s         = 12; // Mean zero-crossing period, s (VTM02)
  double mean_wave_direction_deg    = 13; // Mean wave direction, degrees from N (VMDR)
  double bottom_temperature_c       = 14; // Bottom temperature, °C (0 if not available)
  double mixed_layer_depth_m        = 15; // Mixed layer depth, m (0 if not available)
}
