syntax = "proto3";

package ltu.cis.tracks.v1;

// Air quality reading from PurpleAir sensor network (purpleair_bridge.py)
// Published to: <ORG>/air/purpleair/<sensor-id>/v1
// JSON keys _ts → timestamp, _src → source. Zero means "not present" for numerics.
message AirQualityReading {
  double timestamp             = 1;  // Unix epoch when fetched (_ts)
  string source                = 2;  // "purpleair" (_src)
  int32  sensor_id             = 3;  // PurpleAir sensor index
  string sensor_name           = 4;  // Sensor name as set by owner
  double lat_deg               = 5;  // WGS-84 latitude
  double lon_deg               = 6;  // WGS-84 longitude
  double pm1_ugm3              = 7;  // PM1.0 concentration, µg/m³ (CF=ATM)
  double pm25_ugm3             = 8;  // PM2.5 concentration, µg/m³ (CF=ATM)
  double pm10_ugm3             = 9;  // PM10 concentration, µg/m³ (CF=ATM)
  double pm25_cf1_ugm3         = 10; // PM2.5 CF=1 (indoor correction factor)
  double temperature_c         = 11; // Onboard temperature, °C (runs ~8°C warm)
  double relative_humidity_pct = 12; // Onboard relative humidity, %
  double pressure_hpa          = 13; // Barometric pressure, hPa
  int32  aqi                   = 14; // Calculated US EPA AQI (0 if not computed)
  string aqi_category          = 15; // "Good", "Moderate", "USG", "Unhealthy", etc.
  int32  confidence            = 16; // Sensor confidence 0–100 (channel A vs B agreement)
}
