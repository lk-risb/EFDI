# One-time PostgreSQL -> MariaDB import. The legacy pgdata directory is mounted
# read-write because PostgreSQL itself needs normal WAL/runtime access; the
# importer never mutates source rows. Keep zenoh-admin stopped during the copy.
services:
  zenoh-admin-db-postgres-migration:
    image: postgres:16-alpine3.24@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    container_name: efdi-pod-zenoh-admin-db-postgres-migration
    network_mode: host
    profiles: [postgres-migration]
    command: ["postgres", "-c", "listen_addresses=127.0.0.1"]
    environment:
      - POSTGRES_USER=${ZENOH_ADMIN_DB_USER:?set ZENOH_ADMIN_DB_USER in .env}
      - POSTGRES_PASSWORD=${ZENOH_ADMIN_DB_PASSWORD:?set ZENOH_ADMIN_DB_PASSWORD in .env}
      - POSTGRES_DB=admin
      - PGPORT=${ZENOH_ADMIN_DB_POSTGRES_PORT:-55433}
    volumes:
      - ${POD_STATE_DIR:?set in .env}/zenoh-admin/pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ZENOH_ADMIN_DB_USER:-zenoh_admin} -p ${ZENOH_ADMIN_DB_POSTGRES_PORT:-55433}"]
      interval: 5s
      timeout: 5s
      retries: 12

  zenoh-admin-db-import:
    build:
      context: ./zenoh-admin
      target: postgres-migration
    network_mode: host
    profiles: [postgres-migration]
    depends_on:
      zenoh-admin-db:
        condition: service_healthy
      zenoh-admin-db-postgres-migration:
        condition: service_healthy
    environment:
      - ZENOH_ADMIN_DB_USER=${ZENOH_ADMIN_DB_USER:?set ZENOH_ADMIN_DB_USER in .env}
      - ZENOH_ADMIN_DB_PASSWORD=${ZENOH_ADMIN_DB_PASSWORD:?set ZENOH_ADMIN_DB_PASSWORD in .env}
      - ZENOH_ADMIN_DB_ADDRESS=127.0.0.1:${ZENOH_ADMIN_DB_PORT:-3307}
      - EFDI_MIGRATION_POSTGRES_ADDRESS=127.0.0.1:${ZENOH_ADMIN_DB_POSTGRES_PORT:-55433}
    entrypoint: ["python", "-m", "api.migrate_postgres"]
