syntax = "proto3";

package efdi.data.v2;

// One OGC SensorThings API (Part 1: Sensing) Observation, normalized.
message SensorThingsObservation {
  double timestamp = 1;
  string source = 2;
  string uid = 3;
  double lat_deg = 4;
  double lon_deg = 5;
  optional string datastream_name = 6;
  optional string observed_property = 7;
  optional string sensor_name = 8;
  optional string thing_name = 9;
  optional double result_value = 10;
  optional string result_text = 11;
  optional string unit_symbol = 12;
  optional string phenomenon_time = 13;
}
