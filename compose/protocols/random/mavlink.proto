syntax = "proto3";

package efdi.protocols.v2;

import "protocols/random/normalized_track.proto";

// Matches MAVLink 1/2 vehicle state emitted by mavlink.py.
message MavlinkTrack {
  efdi.data.v2.NormalizedTrack track = 1;
  uint32 system_id = 2;
  optional uint32 component_id = 3;
  optional string vehicle_type = 4;
}
