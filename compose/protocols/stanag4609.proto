syntax = "proto3";

package efdi.protocols.v2;

import "normalized_track.proto";

// STANAG 4609 / MISB KLV ingest with a normalized track projection.
message Stanag4609Track {
  efdi.data.v2.NormalizedTrack track = 1;
  bytes klv_raw = 2;
  string stream_id = 3;
  uint32 packet_index = 4;
  string klv_key_hex = 5;
  uint32 klv_len = 6;
  optional string source_tag = 7;
}
