syntax = "proto3";

package efdi.protocols.v2;

import "protocols/proto/normalized_track.proto";

// Historical deployment profile only; enabled by STANAG4586_PROFILE after VSM ICD validation.
message Stanag4586Track {
  efdi.data.v2.NormalizedTrack track = 1;
  uint32 vsm_instance = 2;
  optional double alt_m = 3;
  optional double alt_agl_m = 4;
  optional double fuel_pct = 5;
}

// STANAG 4607 GMTI (Ground Moving Target Indicator) — one Dwell Segment
// Target Report per track. Nested Dwell/sensor context is JSON-only (see
// AsterixCat19Status's comment in cat.proto for why nested dicts stay JSON-only).
message Stanag4607Track {
  efdi.data.v2.NormalizedTrack track = 1;
  uint32 job_id = 2;
  uint32 target_report_index = 3;
  optional int32 target_classification = 4;
  optional double radar_cross_section_dbsm = 5;
  optional double radial_velocity_ms = 6;
  optional double dwell_time_s = 7;
  optional double sensor_lat_deg = 8;
  optional double sensor_lon_deg = 9;
  optional double sensor_alt_m = 10;
}

// STANAG 4609 / MISB KLV ingest with a normalized track projection.
message Stanag4609Track {
  efdi.data.v2.NormalizedTrack track = 1;
  bytes klv_raw = 2;
  string stream_id = 3;
  uint32 packet_index = 4;
  string klv_key = 5;
  uint32 klv_len = 6;
  optional string source_tag = 7;
  optional double sensor_lat_deg = 8;
  optional double sensor_lon_deg = 9;
  optional double sensor_alt_m = 10;
  optional double frame_center_lat_deg = 11;
  optional double frame_center_lon_deg = 12;
  optional double frame_center_alt_m = 13;
  optional double platform_heading_deg = 14;
  optional double sensor_relative_azimuth_deg = 15;
  optional double sensor_relative_elevation_deg = 16;
}

// Matches the verified JREAP-C/Link-16 subsets decoded by stanag.py (--proto 5516).
message Stanag5516Track {
  efdi.data.v2.NormalizedTrack track = 1;
  string j_message = 2;
  uint32 track_number = 3;
  optional string domain = 4;
  optional int32 altitude_ft = 5;
}
