syntax = "proto3";

package efdi.data.v2;

message SpectrumObservation {
  double timestamp = 1;
  string source = 2;
  string uid = 3;
  optional string sensor_id = 4;
  optional double frequency_hz = 5;
  optional double bandwidth_hz = 6;
  optional double power_dbm = 7;
  optional double bearing_deg = 8;
  optional double lat_deg = 9;
  optional double lon_deg = 10;
  optional double confidence = 11;
  optional string emitter_id = 12;
  map<string, string> metadata = 13;
}
