syntax = "proto3";

package efdi.data.v2;

// Aaronia AARTOS drone-tracking JSON, normalized from the vendor's
// documented Sample/TrackState/trackings[] schema (protocols/vendors/aartos).
message AartosTrack {
  double timestamp = 1;
  string source = 2;
  string uid = 3;
  double lat_deg = 4;
  double lon_deg = 5;
  string callsign = 6;
  optional string aartos_category = 7;
  optional string aartos_alert_level = 8;
  optional double aartos_probability = 9;
  repeated int64 aartos_zone_ids = 10;
  optional double geo_alt_m = 11;
  optional double speed_ms = 12;
  optional double heading_deg = 13;
  optional double aartos_predicted_lat_deg = 14;
  optional double aartos_predicted_lon_deg = 15;
}
