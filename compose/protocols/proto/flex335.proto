syntax = "proto3";

package efdi.protocols.v2;

import "protocols/proto/normalized_track.proto";

// Normalized contract for the BSI FLEX 335 v2 subset in flex335.py.
message SapientFlex335Track {
  efdi.data.v2.NormalizedTrack track = 1;
  string sapient_message_type = 2;
  string sensor_id = 3;
  optional string object_id = 4;
  optional string sapient_report_id = 5;
  optional string sapient_class = 6;
  repeated string sapient_node_types = 7;
  optional string sapient_state = 8;
  optional double detection_confidence = 9;
  optional string sapient_alert_type = 10;
  optional string sapient_alert_status = 11;
  optional string sapient_alert_priority = 12;
}
