  optional string vnav_active = 202;
  optional string wake_turb_cat = 203;
  optional int64 wind_dir_deg = 204;
  optional int64 wind_speed_kt = 205;
  optional uint32 fpps_sac = 206;                  // I062/390 TAG: FPPS Identification SAC
  optional uint32 fpps_sic = 207;                  // I062/390 TAG: FPPS Identification SIC
  optional uint32 ifps_id_type = 208;              // I062/390 IFI: IFPS_FLIGHT_ID type
  optional uint32 ifps_flight_id = 209;            // I062/390 IFI: IFPS_FLIGHT_ID number
  optional uint32 runway_nu1 = 210;                // I062/390 RDS: runway number, first digit
  optional uint32 runway_nu2 = 211;                // I062/390 RDS: runway number, second digit
  optional uint32 control_centre = 212;            // I062/390 CTL: current control centre
  optional uint32 control_position = 213;          // I062/390 CTL: current control position
  optional uint32 stand_emplacement = 214;         // I062/390 STS: stand emplacement status
  optional uint32 stand_availability = 215;        // I062/390 STS: stand availability status
  optional bool pre_emergency_squawk_valid = 216;  // I062/390 PEM: VA bit
  optional string pre_emergency_squawk = 217;      // I062/390 PEM: MODE3A, octal
  optional string pre_emergency_callsign = 218;    // I062/390 PEC
}

