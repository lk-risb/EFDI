  optional uint32 valid_octets = 14;
  optional uint32 valid_cells = 15;
  optional string video_block_hex = 16;
  optional uint32 video_block_cells = 17;
  optional double tod_s = 18;
}

// Matches EUROCONTROL CAT-247 Ed.1.3 Version Number Exchange: a source
// reports which edition of each ASTERIX category it transmits.
