  optional string amalgamated = 113;
  optional string approach_mode = 114;
  optional int64 baro_alt_accuracy_ft = 115;
  optional double baro_setting_mb = 116;
  optional double baro_vr_fpm = 117;
  optional string bds_gs_kt = 118;
  optional string calc_alt_ft = 119;
  optional string callsign = 120;
  optional double cleared_fl = 121;
  optional string current_fl = 122;
  optional string departure_icao = 123;
  optional string destination_icao = 124;
  optional string emergency_code = 125;
  optional string emergency_str = 126;
  optional int64 emitter_category = 127;
  optional int64 final_alt_ft = 128;
  optional int64 fleet_id = 129;
  optional string flight_gat = 130;
  optional string flight_plan_callsign = 131;
  optional string flight_rules = 132;
  optional string fp_callsign = 133;
  optional string fp_correlated = 134;
  optional double geo_alt_accuracy_ft = 135;
  optional double geo_vr_fpm = 136;
  optional string height_src = 137;
  optional string high_priority = 138;
  optional double ias_kt = 139;
  optional string icao24 = 140;
  optional string ivv_fpm = 141;
  optional string lateral_trend = 142;
  optional double mach = 143;
  optional double mag_hdg_deg = 144;
  optional int64 meas_alt_ft = 145;
  optional double meas_az_deg = 146;
  optional double meas_range_nm = 147;
  optional string measured_by = 148;
  optional string mil_emergency = 149;
  optional string mil_ident = 150;
  optional string mode1 = 151;
  optional string mode2 = 152;
  optional string mode5_active = 153;
  optional string mode5_data = 154;
  optional string mode5_iff = 155;
  optional string mode_c_alt_ft = 156;
  optional string pos_accuracy_lat_m = 157;
  optional string pos_accuracy_lon_m = 158;
  optional double pos_accuracy_x_m = 159;
  optional double pos_accuracy_y_m = 160;
  optional bool qnh_corrected = 161;
  optional double roll_deg = 162;
  optional string runway = 163;
  optional string rvsm = 164;
  optional string sel_alt_fms_ft = 165;
