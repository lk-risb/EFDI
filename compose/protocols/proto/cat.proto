syntax = "proto3";

package efdi.protocols.v2;

import "protocols/proto/normalized_track.proto";

// Matches EUROCONTROL CAT-001 Ed.1.4 monoradar plot/track reports. One
// physical wire record can be a plot OR a track (see is_track) — the two
// share FRN1/FRN2 but diverge from FRN3 onward; this message is the flat
// union of both variants' fields.
message AsterixCat1Track {
  efdi.data.v2.NormalizedTrack track = 1;
  optional uint32 sac = 2;
  optional uint32 sic = 3;
  optional bool is_track = 4;
  optional bool simulated = 5;
  optional string ssr_psr = 6;
  optional uint32 antenna = 7;
  optional bool spi = 8;
  optional bool fixed_transponder = 9;
  optional bool test_target = 10;
  optional string emergency = 11;
  optional bool military_emergency = 12;
  optional bool military_id = 13;
  optional uint32 track_num = 14;
  optional double rho_nm = 15;
  optional double theta_deg = 16;
  optional double x_nm = 17;
  optional double y_nm = 18;
  optional double speed_ms = 19;
  optional double heading_deg = 20;
  optional string mode3a_squawk = 21;
  optional bool mode3a_validated = 22;
  optional bool mode3a_garbled = 23;
  optional bool mode3a_smoothed = 24;
  optional string mode2_squawk = 25;
  optional bool mode2_validated = 26;
  optional bool mode2_garbled = 27;
  optional bool mode2_smoothed = 28;
  optional double alt_baro_ft = 29;
  optional bool altitude_validated = 30;
  optional bool altitude_garbled = 31;
  optional double tod_trunc_s = 32;
  optional double doppler_speed_ms = 33;
  optional int32 received_power_dbm = 34;
  optional uint32 mode_c_gray_code = 35;
  optional bool mode_c_validated = 36;
  optional bool mode_c_garbled = 37;
  optional bool confirmed = 38;
  optional string radar_type = 39;
  optional bool maneuvering = 40;
  optional bool doubtful_association = 41;
  optional uint32 rdp_chain = 42;
  optional bool ghost_track = 43;
  optional bool x_pulse_mode3a = 44;
  optional bool x_pulse_modec = 45;
  optional bool x_pulse_mode2 = 46;
  // mode3a_confidence / mode2_confidence / mode_c_confidence (12-bit pulse
  // quality dicts) and warnings / plot_characteristics_raw / track_quality_raw
  // (repetitive lists) are nested — JSON-only, see AsterixCat19Status's
  // comment above for why.
}

// Matches EUROCONTROL CAT-002 Ed.1.2 monoradar service messages (the
// status/marker companion to CAT-001, same relationship CAT-034 has to
// CAT-048).
message AsterixCat2Status {
  efdi.data.v2.NormalizedTrack sensor = 1;
  optional uint32 sac = 2;
  optional uint32 sic = 3;
  optional string msg_type = 4;
  optional double sector_deg = 5;
  optional double tod_s = 6;
  optional double antenna_rotation_s = 7;
  optional double window_rho_start_nm = 8;
  optional double window_rho_end_nm = 9;
  optional double window_theta_start_deg = 10;
  optional double window_theta_end_deg = 11;
  optional double range_error_nm = 12;
  optional double azimuth_error_deg = 13;
  // station_configuration_raw / station_processing_mode_raw / warnings_raw
  // (application-defined raw byte lists) and plot_counts (repeated group)
  // are nested — JSON-only, see AsterixCat19Status's comment above for why.
}

