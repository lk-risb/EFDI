  optional string service_status_report = 13;
}

// Matches EUROCONTROL CAT-150 Ed.3.0 MADAP Plan Server Flight Data Message
// (Maastricht UAC legacy flight-plan distribution/correlation/conflict
// data; carries no position — see cat.py's CAT-150 section comment for why
// I150/151 WGS-84 route points are absent from this edition's own UAP).
// route_point_descriptions, route_point_coordinates, route_point_times,
// route_point_flight_levels, route_point_speeds, newly_correlated_plans,
// newly_decorrelated_plans, tracks_in_conflict, and
// route_point_requested_flight_levels are nested — JSON-only, see
// AsterixCat19Status's comment above for why.
message AsterixCat150Status {
  efdi.data.v2.NormalizedTrack sensor = 1;
  optional uint32 sac = 2;
  optional uint32 sic = 3;
  optional uint32 dest_centre = 4;
  optional uint32 dest_workstation = 5;
  optional uint32 source_centre = 6;
  optional uint32 source_workstation = 7;
  optional string msg_type = 8;
  optional uint32 plan_ref_number = 9;
  optional string callsign = 10;
  optional string present_squawk = 11;
  optional string next_squawk = 12;
  optional string departure_airport = 13;
  optional string destination_airport = 14;
  optional bool general_air_traffic = 15;
  optional bool operational_air_traffic = 16;
  optional bool complete_flight_plan = 17;
  optional bool short_flight_plan = 18;
  optional bool in_hold = 19;
  optional bool rvsm_equipped = 20;
  optional bool rvsm_capable = 21;
  optional bool rvsm_exempted = 22;
  optional string number_of_aircraft = 23;
  optional string aircraft_type = 24;
  optional string wake_turbulence_cat = 25;
  optional string cleared_flight_level = 26;
  optional string controller_id = 27;
  optional string field_18 = 28;
  optional uint32 correlated_track_num = 29;
  optional uint32 max_plan_count = 30;
  optional uint32 number_of_plans = 31;
}

