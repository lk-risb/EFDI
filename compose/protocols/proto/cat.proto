// Matches EUROCONTROL CAT-008 Ed.1.3 monoradar derived weather information
// (weather-image vectors/contours, not target tracks). cartesian_vectors,
// polar_vectors, contour_points, weather_vectors, processing_params_raw,
// and station_configuration_raw are nested — JSON-only, see
// AsterixCat19Status's comment above for why.
message AsterixCat8Weather {
  efdi.data.v2.NormalizedTrack sensor = 1;
  optional uint32 sac = 2;
  optional uint32 sic = 3;
  optional string msg_type = 4;
  optional string coord_system = 5;
  optional uint32 intensity = 6;
  optional double shading_deg = 7;
  optional bool test_vector = 8;
  optional bool error_condition = 9;
  optional string contour_coord_system = 10;
  optional uint32 contour_intensity = 11;
  optional string contour_position = 12;
  optional uint32 contour_serial_number = 13;
  optional double tod_s = 14;
  optional int32 scaling_factor = 15;
  optional uint32 reduction_stage = 16;
  optional uint32 total_items = 17;
}

// Matches EUROCONTROL CAT-009 Ed.2.1 composite weather reports (merged
// multi-radar weather picture). cartesian_vectors, processing_params_raw,
// and radar_status are nested — JSON-only, see AsterixCat19Status's
// comment above for why.
message AsterixCat9Weather {
  efdi.data.v2.NormalizedTrack sensor = 1;
  optional uint32 sac = 2;
  optional uint32 sic = 3;
  optional string msg_type = 4;
  optional string coord_system = 5;
  optional uint32 intensity = 6;
  optional double shading_deg = 7;
  optional uint32 step_number = 8;
  optional double tod_s = 9;
  optional int32 scaling_factor = 10;
  optional uint32 reduction_stage = 11;
  optional uint32 vector_count = 12;
}

