syntax = "proto3";

package efdi.protocols.v2;

import "normalized_track.proto";

// Matches the vehicle-state subset decoded by stanag4586.py.
message Stanag4586Track {
  efdi.data.v2.NormalizedTrack track = 1;
  uint32 vsm_instance = 2;
  optional double altitude_msl_m = 3;
  optional double altitude_agl_m = 4;
  optional double fuel_percent = 5;
}
