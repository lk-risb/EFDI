syntax = "proto3";

package efdi.protocols.v2;

import "normalized_track.proto";

// Normalized contract for the BSI FLEX 335 v2 subset in sapient_flex335.py.
message SapientFlex335Track {
  efdi.data.v2.NormalizedTrack track = 1;
  string message_type = 2;
  string sensor_id = 3;
  optional string object_id = 4;
  optional string report_id = 5;
  optional string object_class = 6;
  repeated string node_types = 7;
  optional string state = 8;
  optional double confidence = 9;
  optional string alert_type = 10;
  optional string alert_status = 11;
  optional string alert_priority = 12;
}
