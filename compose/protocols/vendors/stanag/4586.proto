syntax = "proto3";

package efdi.protocols.v2;

import "protocols/random/normalized_track.proto";

// Historical deployment profile only; enabled by STANAG4586_PROFILE after VSM ICD validation.
message Stanag4586Track {
  efdi.data.v2.NormalizedTrack track = 1;
  uint32 vsm_instance = 2;
  optional double alt_m = 3;
  optional double alt_agl_m = 4;
  optional double fuel_pct = 5;
}
