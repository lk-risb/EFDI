syntax = "proto3";

package ltu.cis.tracks.v1;

// Source-record schema for adsblol_bridge.py.
// Current JSON topics:
//   <PREFIX>/<ORG>/air/adsblol/adsb/civ/aircraft/tracks/v1
//   <PREFIX>/<ORG>/air/adsblol/adsb/mil/aircraft/tracks/v1
message AdsbLolTrack {
  double timestamp = 1; // Local Unix fetch time (_ts)
  string source = 2; // "adsblol" (_src)
  optional string icao24 = 3;
  optional string callsign = 4;
  optional string registration = 5;
  optional string aircraft_type = 6;
  double lat_deg = 7;
  double lon_deg = 8;
  optional int32 alt_baro_ft = 9;
  optional int32 alt_geom_ft = 10;
  optional double ground_speed_kts = 11;
  optional double track_deg = 12;
  optional string squawk = 13;
  optional bool is_military = 14;
  optional string aircraft_description = 15;
  optional string pos_source = 16;
  optional bool on_ground = 17;
  optional double ias_kt = 18;
  optional double tas_kt = 19;
  optional double mach = 20;
  optional double track_angle_rate_degs = 21;
  optional double roll_deg = 22;
  optional double mag_hdg_deg = 23;
  optional double true_heading_deg = 24;
  optional int32 baro_vr_fpm = 25;
  optional int32 geo_vr_fpm = 26;
  optional string emergency_str = 27;
  optional string emitter_category_str = 28;
  optional double baro_setting_mb = 29;
  optional int32 selected_alt_ft = 30;
  optional int32 fms_selected_alt_ft = 31;
  optional string selected_alt_source = 32;
  optional double selected_heading_deg = 33;
  optional string nav_modes = 34;
  optional int32 nic = 35;
  optional int32 radius_containment_m = 36;
  optional double position_age_s = 37;
  optional int32 adsb_version = 38;
  optional int32 nic_baro = 39;
  optional int32 nac_p = 40;
  optional int32 nac_v = 41;
  optional int32 sil = 42;
  optional string sil_type = 43;
  optional int32 gva = 44;
  optional int32 sda = 45;
  optional int32 message_count = 46;
  optional double message_age_s = 47;
  optional double rssi_db = 48;
  optional bool spi = 49;
  optional bool alert = 50;
  optional int32 database_flags = 51;
  optional bool is_interesting = 52;
  optional bool is_pia = 53;
  optional bool is_ladd = 54;
}
