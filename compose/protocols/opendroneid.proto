syntax = "proto3";

package efdi.protocols.v2;

import "normalized_track.proto";

// Matches ASTM F3411 / ASD-STAN records translated by opendroneid.py.
message OpenDroneIdTrack {
  efdi.data.v2.NormalizedTrack track = 1;
  optional uint32 protocol_version = 2;
  optional string id_type = 3;
  optional string uas_id = 4;
  optional string ua_type = 5;
  optional string status = 6;
  optional string height_reference = 7;
  optional string operator_id = 8;
  optional double operator_lat_deg = 9;
  optional double operator_lon_deg = 10;
  optional double operator_alt_m = 11;
  optional string description = 12;
  optional string transport = 13;
  optional int32 rssi_dbm = 14;
  optional string receiver_id = 15;
  optional string transmitter_id = 16;
}

message OpenDroneIdRawIngress {
  string receiver_id = 1;
  string transmitter_id = 2;
  bytes payload = 3;
  optional string transport = 4;
  optional int32 rssi_dbm = 5;
}
