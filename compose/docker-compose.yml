      - SITAWARE_PASS=${SITAWARE_PASS:-}
      - SITAWARE_SOURCE=${SITAWARE_SOURCE:-efdi-live}
    command: >
      python3 /app/nato_nvg_layer.py
      --url ${SITAWARE_URL:-}
      --user ${SITAWARE_USER:-}
      --password ${SITAWARE_PASS:-}
      --source ${SITAWARE_SOURCE:-efdi-live}
    volumes:
