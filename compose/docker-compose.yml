# EFDI infrastructure bundle.
#
# Only the Zenoh router and its admin stack are containerized. Sensor bridges
# and output layers run as native Python processes via ../start.sh or ../run.sh;
# keeping them out of Compose preserves per-process logs/PIDs and avoids a
# container/restart loop for every optional integration.
#
# network_mode: host so each service binds the pod's mesh IP directly. No netns sidecar, no
# NAT gymnastics.
#
# Values come from .env (copied from .env.example). Images are pinned by digest (ADR 0859).
# zenoh-router uses an ALREADY-PUBLISHED image — no local build context.

services:
  step-ca:
    profiles: ["managed-ca"]
    image: smallstep/step-ca:0.30.2@sha256:a2b17872915c193259b75a5474c398326f41bd199f0842093e52cf4182bc8270
    container_name: efdi-pod-step-ca
    network_mode: host
    restart: unless-stopped
    command: ["/usr/local/bin/step-ca", "--password-file", "/home/step/secrets/password", "/home/step/config/ca.json"]
    volumes:
      - ${POD_STATE_DIR:?set POD_STATE_DIR in .env}/pki/step-ca:/home/step
    healthcheck:
      test: ["CMD", "step", "ca", "health", "--ca-url", "https://localhost:${EFDI_STEP_CA_PORT:-9000}", "--root", "/home/step/certs/root_ca.crt"]
      interval: 15s
      timeout: 5s
      retries: 5

  zenoh-router:
    # Upstream eclipse/zenoh, pinned by content digest (ADR 0858 upstream pivot).
    image: eclipse/zenoh:1.9.0@sha256:157965d71e0bfd0a044d76a985ff0e5c306ad3968929168fb9678cd2a7fec23f
    container_name: efdi-pod-zenoh-router
    network_mode: host
    restart: unless-stopped
    environment:
      - RUST_LOG=${ZENOH_LOG:-info}
    volumes:
      # Rendered from host/zenoh-router.json5.tmpl by first-boot.sh.
      - ${POD_STATE_DIR:?set in .env}/zenoh/config.json5:/etc/zenoh/config.json5:ro
      - ${POD_STATE_DIR}/zenoh/tls:/etc/zenoh/tls:ro
      - ${POD_STATE_DIR}/zenoh/rocksdb:/var/lib/zenoh/rocksdb
      # NOTE: this v0 pod config declares NO per-prefix storages, so the rocksdb backend .so is
      # not required (basic pub/sub works without it). Add the SHA256-verified .so overlay
      # (mirror the sandbox zenoh config) when the pod needs replay/retention.
    command: ["-c", "/etc/zenoh/config.json5"]
    healthcheck:
      # The previous `true` probe reported healthy even when zenohd had
      # crashed or failed to bind.  The image contains BusyBox nc; probe the
      # loopback client port that native bridges actually use.
      test: ["CMD-SHELL", "nc -z 127.0.0.1 ${ZENOH_LOCAL_TCP_PORT:-7448}"]
      interval: 5s
      timeout: 5s
      retries: 12

  zenoh-router-test:
    # Isolated test router for local pub/sub testing — same image, same certs/ACL/namespace
    # as zenoh-router, but different ports and NO connect.endpoints (never dials the fabric).
    # Config: ${POD_STATE_DIR}/zenoh-test/config.json5. Not started by default — `docker compose
    # --profile test up -d zenoh-router-test`.
    image: eclipse/zenoh:1.9.0@sha256:157965d71e0bfd0a044d76a985ff0e5c306ad3968929168fb9678cd2a7fec23f
    container_name: efdi-pod-zenoh-router-test
    network_mode: host
    restart: "no"
    profiles:
      - test
    environment:
      - RUST_LOG=${ZENOH_LOG:-info}
    volumes:
      - ${POD_STATE_DIR:?set in .env}/zenoh-test/config.json5:/etc/zenoh/config.json5:ro
      - ${POD_STATE_DIR}/zenoh/tls:/etc/zenoh/tls:ro
    command: ["-c", "/etc/zenoh/config.json5"]
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 ${ZENOH_TEST_LOCAL_TCP_PORT:-7458}"]
      interval: 5s
      timeout: 5s
      retries: 12

  zenoh-admin-db:
    image: mariadb:11.4.12-noble@sha256:a794d9eb009e20de605858a11f32f63b4075cbd197c650436f0e3b457e4caed7
    container_name: efdi-pod-zenoh-admin-db
    network_mode: host
    restart: unless-stopped
    command:
      - --bind-address=127.0.0.1
      - --port=${ZENOH_ADMIN_DB_PORT:-3307}
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_bin
      - --default-time-zone=+00:00
      - --transaction-isolation=READ-COMMITTED
    environment:
      - MARIADB_ROOT_PASSWORD=${ZENOH_ADMIN_DB_ROOT_PASSWORD:?set ZENOH_ADMIN_DB_ROOT_PASSWORD in .env}
      - MARIADB_ROOT_HOST=localhost
      - MARIADB_DATABASE=admin
      - MARIADB_USER=${ZENOH_ADMIN_DB_USER:?set ZENOH_ADMIN_DB_USER in .env}
      - MARIADB_PASSWORD=${ZENOH_ADMIN_DB_PASSWORD:?set ZENOH_ADMIN_DB_PASSWORD in .env}
    volumes:
      - ${POD_STATE_DIR}/zenoh-admin/mariadb:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Scoped Docker API access for zenoh-admin: container inspection and lifecycle
  # only. The break-glass shell runs through the host admin-control helper,
  # which has a fixed router target and fixed /bin/sh command; the web container
  # never receives Docker exec capability.
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0@sha256:9e4b9e7517a6b660f2cc903a19b257b1852d5b3344794e3ea334ff00ae677ac2
    container_name: efdi-pod-docker-socket-proxy
    restart: unless-stopped
    environment:
      - CONTAINERS=1
      - POST=1
      - IMAGES=0
      - NETWORKS=0
      - VOLUMES=0
      - EXEC=0
      - BUILD=0
      - COMMIT=0
      - CONFIGS=0
      - DISTRIBUTION=0
      - INFO=1
      - NODES=0
      - PLUGINS=0
      - SECRETS=0
      - SERVICES=0
      - SESSION=0
      - SWARM=0
      - SYSTEM=0
      - TASKS=0
      - VERSION=1
      - AUTH=0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "127.0.0.1:2375:2375"
    healthcheck:
      disable: true

  zenoh-admin:
    build:
      context: ./zenoh-admin
      target: runtime
    container_name: efdi-pod-zenoh-admin
    network_mode: host
    restart: unless-stopped
    depends_on:
      zenoh-router:
        condition: service_healthy
      zenoh-admin-db:
        condition: service_healthy
      docker-socket-proxy:
        condition: service_started
    environment:
      - EFDI_CERT_DIR=${EFDI_CERT_DIR:-/certs/efdi}
      - EFDI_CERT_HOST_DIR=${BUNDLE_DIR:-}
      - PARTNER_NAMESPACE=${PARTNER_NAMESPACE}
      - EFDI_TRUST_DOMAIN=${EFDI_TRUST_DOMAIN:-efdi.global}
      - NAMESPACE_PREFIX_FILE=/namespace-prefix
      - DATA_NAMESPACE_PREFIX_FILE=/data-topic-prefix
      - ZENOH_LOCAL_ENDPOINT=${ZENOH_ADMIN_ZENOH_ENDPOINT:-tcp/127.0.0.1:7448}
      - ZENOH_CONFIG_PATH=/zenoh-config/config.json5
      - ZENOH_TEMPLATE_PATH=/zenoh-config-template/zenoh-router.json5.tmpl
      - ZENOH_ADMIN_DB_USER=${ZENOH_ADMIN_DB_USER:?set ZENOH_ADMIN_DB_USER in .env}
      - ZENOH_ADMIN_DB_PASSWORD=${ZENOH_ADMIN_DB_PASSWORD:?set ZENOH_ADMIN_DB_PASSWORD in .env}
      - ZENOH_ADMIN_DB_ADDRESS=127.0.0.1:${ZENOH_ADMIN_DB_PORT:-3307}
      - ZENOH_ADMIN_SECRET_KEY=${ZENOH_ADMIN_SECRET_KEY:?set ZENOH_ADMIN_SECRET_KEY in .env}
      - ZENOH_ADMIN_FIRST_USER=${ZENOH_ADMIN_FIRST_USER:-admin}
      - ZENOH_ADMIN_FIRST_PASS=${ZENOH_ADMIN_FIRST_PASS:-}
      - ZENOH_ADMIN_TRUSTED_PARENT_CERT_PATH=/certs/trusted-parent.pem
      - ZENOH_ADMIN_TRUSTED_PARENT_CN=${ZENOH_ADMIN_TRUSTED_PARENT_CN:-}
      - EFDI_PARENT_NAMESPACE=${EFDI_PARENT_NAMESPACE:-}
      - EFDI_ROUTER_CA_PUBLIC_PATH=/certs/router-ca-cert.pem
      - EFDI_POLICY_SIGNER_CERT_PATH=/certs/policy-signer-cert.pem
      - EFDI_POLICY_SIGNER_KEY_PATH=/certs/policy-signer-key.pem
      - EFDI_LINK_SECRET_PATH=/zenoh-config/link-credentials.json
      - EFDI_TRUST_BOOTSTRAP_PATH=/certs/efdi/trust/managed-bootstrap.json
      - ZENOH_ADMIN_DEV_CORS_ORIGIN=${ZENOH_ADMIN_DEV_CORS_ORIGIN:-}
      - ZENOH_ROUTER_CONTAINER=${ZENOH_ROUTER_CONTAINER:-efdi-pod-zenoh-router}
      # Optional OIDC SSO — unset issuer/client = disabled, password login only.
      - OIDC_ISSUER=${OIDC_ISSUER:-}
      - OIDC_CLIENT_ID=${OIDC_CLIENT_ID:-}
      - OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET:-}
      - OIDC_PROVIDER_NAME=${OIDC_PROVIDER_NAME:-SSO}
      - OIDC_SCOPES=${OIDC_SCOPES:-openid profile email groups}
      - OIDC_GROUPS_CLAIM=${OIDC_GROUPS_CLAIM:-groups}
      - OIDC_REDIRECT_URL=${OIDC_REDIRECT_URL:-}
      - OIDC_ROLE_MAP=${OIDC_ROLE_MAP:-}
      - OIDC_DEFAULT_ROLE=${OIDC_DEFAULT_ROLE:-readonly}
      - OIDC_POST_LOGIN_URL=${OIDC_POST_LOGIN_URL:-/}
      - DOCKER_HOST=tcp://127.0.0.1:2375
      - EFDI_CONTROL_URL=${EFDI_CONTROL_URL:-http://127.0.0.1:18896}
      - EFDI_CONTROL_TOKEN=${EFDI_CONTROL_TOKEN:-}
      - EFDI_SHELL_CONTROL_HOST=${EFDI_SHELL_CONTROL_HOST:-127.0.0.1}
      - EFDI_SHELL_CONTROL_PORT=${EFDI_SHELL_CONTROL_PORT:-18897}
      - EFDI_SHELL_ENABLED=${EFDI_SHELL_ENABLED:-true}
      - EFDI_RUNTIME_LOG_DIR=/runtime-logs
    volumes:
      # Least-privilege identity mount: never expose efdi-ca-root-key.pem (or a
      # router-CA key) to the WebUI container. It needs only its own transport
      # identity for local Zenoh sessions/config signatures and public trust.
      - ${BUNDLE_DIR:?set BUNDLE_DIR in .env}/efdi/efdi-ca-root.pem:/certs/efdi/efdi-ca-root.pem:ro
      - ${BUNDLE_DIR}/efdi/${PARTNER_NAMESPACE}-cert.pem:/certs/efdi/${PARTNER_NAMESPACE}-cert.pem:ro
      - ${BUNDLE_DIR}/efdi/${PARTNER_NAMESPACE}-key.pem:/certs/efdi/${PARTNER_NAMESPACE}-key.pem:ro
      - ${ZENOH_ADMIN_TRUSTED_PARENT_HOST_CERT_PATH:-/dev/null}:/certs/trusted-parent.pem:ro
      - ${EFDI_ROUTER_CA_CERT_PATH:-/dev/null}:/certs/router-ca-cert.pem:ro
      - ${EFDI_POLICY_SIGNER_CERT_PATH:-/dev/null}:/certs/policy-signer-cert.pem:ro
      - ${EFDI_POLICY_SIGNER_KEY_PATH:-/dev/null}:/certs/policy-signer-key.pem:ro
      - ${POD_STATE_DIR}/zenoh:/zenoh-config
      - ../host/zenoh-router.json5.tmpl:/zenoh-config-template/zenoh-router.json5.tmpl:ro
      - ${POD_STATE_DIR}/zenoh-admin-data:/data
      - ${POD_STATE_DIR}/namespace-prefix:/namespace-prefix:rw
      - ${POD_STATE_DIR}/data-topic-prefix:/data-topic-prefix:rw
      - ${POD_STATE_DIR}/logs:/runtime-logs:ro
    healthcheck:
      disable: true

  zenoh-admin-proxy:
    image: caddy:2-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    container_name: efdi-pod-zenoh-admin-proxy
    network_mode: host
    restart: unless-stopped
    depends_on:
      - zenoh-admin
    volumes:
      - ./zenoh-admin/Caddyfile:/etc/caddy/Caddyfile:ro
      - zenoh_admin_caddy_data:/data
    healthcheck:
      disable: true

volumes:
  zenoh_admin_caddy_data:
