  zenoh-admin-db:
    image: postgres:16-alpine
    container_name: efdi-pod-zenoh-admin-db
    network_mode: host
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${ZENOH_ADMIN_DB_USER:?set ZENOH_ADMIN_DB_USER in .env}
      - POSTGRES_PASSWORD=${ZENOH_ADMIN_DB_PASSWORD:?set ZENOH_ADMIN_DB_PASSWORD in .env}
      - POSTGRES_DB=admin
      - PGPORT=${ZENOH_ADMIN_DB_PORT:-5433}
    volumes:
      - ${POD_STATE_DIR}/zenoh-admin/pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ZENOH_ADMIN_DB_USER:-zenoh_admin} -p ${ZENOH_ADMIN_DB_PORT:-5433}"]
      interval: 10s
      timeout: 5s
      retries: 5

  zenoh-admin:
    build:
      context: ./zenoh-admin
    container_name: efdi-pod-zenoh-admin
    network_mode: host
    restart: unless-stopped
    depends_on:
      zenoh-router:
        condition: service_healthy
      zenoh-admin-db:
        condition: service_healthy
    environment:
      - EFDI_CERT_DIR=/certs
      - PARTNER_NAMESPACE=${PARTNER_NAMESPACE}
      - ZENOH_LOCAL_ENDPOINT=${ZENOH_ADMIN_ZENOH_ENDPOINT:-tcp/127.0.0.1:7448}
      - ZENOH_CONFIG_PATH=/zenoh-config/config.json5
      - ZENOH_TEMPLATE_PATH=/zenoh-config-template/zenoh-router.json5.tmpl
      - ZENOH_ADMIN_DB_USER=${ZENOH_ADMIN_DB_USER:?set ZENOH_ADMIN_DB_USER in .env}
      - ZENOH_ADMIN_DB_PASSWORD=${ZENOH_ADMIN_DB_PASSWORD:?set ZENOH_ADMIN_DB_PASSWORD in .env}
      - ZENOH_ADMIN_DB_ADDRESS=127.0.0.1:${ZENOH_ADMIN_DB_PORT:-5433}
      - ZENOH_ADMIN_SECRET_KEY=${ZENOH_ADMIN_SECRET_KEY:?set ZENOH_ADMIN_SECRET_KEY in .env}
      - ZENOH_ADMIN_FIRST_USER=${ZENOH_ADMIN_FIRST_USER:-admin}
      - ZENOH_ADMIN_FIRST_PASS=${ZENOH_ADMIN_FIRST_PASS:-}
    volumes:
      - ${BUNDLE_DIR:?set BUNDLE_DIR in .env}:/certs:ro
      - ${POD_STATE_DIR}/zenoh:/zenoh-config
      - ../host/zenoh-router.json5.tmpl:/zenoh-config-template/zenoh-router.json5.tmpl:ro
      - ${POD_STATE_DIR}/zenoh-admin-data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      disable: true

  zenoh-admin-proxy:
    image: caddy:2-alpine
    container_name: efdi-pod-zenoh-admin-proxy
    network_mode: host
    restart: unless-stopped
    depends_on:
      - zenoh-admin
    volumes:
      - ./zenoh-admin/Caddyfile:/etc/caddy/Caddyfile:ro
      - zenoh_admin_caddy_data:/data
    healthcheck:
      disable: true

volumes:
  zenoh_admin_caddy_data:
