# EFDI — v0 data-plane bundle.
#
# Runs the containerizable data-plane services. The NetBird mesh client runs on the HOST
# directly (see ../host/first-boot.sh), NOT here.
#
# network_mode: host so each service binds the pod's mesh IP directly. No netns sidecar, no
# NAT gymnastics.
#
# Values come from .env (copied from .env.example). Images are pinned by digest (ADR 0859).
# zenoh-router uses an ALREADY-PUBLISHED image — no local build context.

services:
  zenoh-router:
    # Upstream eclipse/zenoh, pinned by content digest (ADR 0858 upstream pivot).
    image: eclipse/zenoh:1.9.0@sha256:157965d71e0bfd0a044d76a985ff0e5c306ad3968929168fb9678cd2a7fec23f
    container_name: efdi-pod-zenoh-router
    network_mode: host
    restart: unless-stopped
    environment:
      - RUST_LOG=${ZENOH_LOG:-info}
    volumes:
      # Rendered from host/zenoh-router.json5.tmpl by first-boot.sh.
      - ${POD_STATE_DIR:?set in .env}/zenoh/config.json5:/etc/zenoh/config.json5:ro
      - ${POD_STATE_DIR}/zenoh/tls:/etc/zenoh/tls:ro
      - ${POD_STATE_DIR}/zenoh/rocksdb:/var/lib/zenoh/rocksdb
      # NOTE: this v0 pod config declares NO per-prefix storages, so the rocksdb backend .so is
      # not required (basic pub/sub works without it). Add the SHA256-verified .so overlay
      # (mirror the sandbox zenoh config) when the pod needs replay/retention.
    command: ["-c", "/etc/zenoh/config.json5"]
    healthcheck:
      test: ["CMD-SHELL", "true"]
      interval: 15s
      timeout: 5s
      retries: 5

  zenoh-router-test:
    # Isolated test router for local pub/sub testing — same image, same certs/ACL/namespace
    # as zenoh-router, but different ports and NO connect.endpoints (never dials the fabric).
    # Config: ${POD_STATE_DIR}/zenoh-test/config.json5. Not started by default — `docker compose
    # --profile test up -d zenoh-router-test`.
    image: eclipse/zenoh:1.9.0@sha256:157965d71e0bfd0a044d76a985ff0e5c306ad3968929168fb9678cd2a7fec23f
    container_name: efdi-pod-zenoh-router-test
    network_mode: host
    restart: "no"
    profiles:
      - test
    environment:
      - RUST_LOG=${ZENOH_LOG:-info}
    volumes:
      - ${POD_STATE_DIR:?set in .env}/zenoh-test/config.json5:/etc/zenoh/config.json5:ro
      - ${POD_STATE_DIR}/zenoh/tls:/etc/zenoh/tls:ro
    command: ["-c", "/etc/zenoh/config.json5"]
    healthcheck:
      test: ["CMD-SHELL", "true"]
      interval: 15s
      timeout: 5s
      retries: 5

  aisstream-bridge:
    build:
      context: ./bridge
    container_name: efdi-pod-aisstream-bridge
    network_mode: host
    restart: unless-stopped
    depends_on:
      zenoh-router:
        condition: service_healthy
    environment:
      - EFDI_CERT_DIR=/certs
      - ZENOH_LOCAL_ENDPOINT=${ZENOH_LOCAL_ENDPOINT:-tcp/127.0.0.1:7448}
      - AISSTREAM_KEY=${AISSTREAM_KEY:-}
    command: ["python3", "/app/aisstream_ws_bridge.py"]
    volumes:
      - ${BUNDLE_DIR:?set BUNDLE_DIR in .env}:/certs:ro
      - ${POD_STATE_DIR}/namespace-prefix:/namespace-prefix:ro
    healthcheck:
      disable: true

  meteo-lt-bridge:
    build:
      context: ./bridge
    container_name: efdi-pod-meteo-lt-bridge
    network_mode: host
    restart: unless-stopped
    depends_on:
      zenoh-router:
        condition: service_healthy
    environment:
      - EFDI_CERT_DIR=/certs
      - ZENOH_LOCAL_ENDPOINT=${ZENOH_LOCAL_ENDPOINT:-tcp/127.0.0.1:7448}
    command: ["python3", "/app/meteolt_forecast_bridge.py"]
    volumes:
      - ${BUNDLE_DIR:?set BUNDLE_DIR in .env}:/certs:ro
      - ${POD_STATE_DIR}/namespace-prefix:/namespace-prefix:ro
    healthcheck:
      disable: true

  aprs-bridge:
    build:
      context: ./bridge
    container_name: efdi-pod-aprs-bridge
    network_mode: host
    restart: unless-stopped
    depends_on:
      zenoh-router:
        condition: service_healthy
    environment:
      - EFDI_CERT_DIR=/certs
      - ZENOH_LOCAL_ENDPOINT=${ZENOH_LOCAL_ENDPOINT:-tcp/127.0.0.1:7448}
    command: ["python3", "/app/aprsis_bridge.py"]
    volumes:
      - ${BUNDLE_DIR:?set BUNDLE_DIR in .env}:/certs:ro
      - ${POD_STATE_DIR}/namespace-prefix:/namespace-prefix:ro
    healthcheck:
      disable: true

  airplaneslive-bridge:
    build:
      context: ./bridge
    container_name: efdi-pod-airplaneslive-bridge
    network_mode: host
    restart: unless-stopped
    depends_on:
      zenoh-router:
        condition: service_healthy
    environment:
      - EFDI_CERT_DIR=/certs
      - ZENOH_LOCAL_ENDPOINT=${ZENOH_LOCAL_ENDPOINT:-tcp/127.0.0.1:7448}
    command: ["python3", "/app/airplaneslive_adsb_bridge.py"]
    volumes:
      - ${BUNDLE_DIR:?set BUNDLE_DIR in .env}:/certs:ro
      - ${POD_STATE_DIR}/namespace-prefix:/namespace-prefix:ro
    healthcheck:
      disable: true

  atak-cot-udp:
    build:
      context: ./bridge
    container_name: efdi-pod-atak-cot-udp
    network_mode: host
    restart: unless-stopped
    depends_on:
      zenoh-router:
        condition: service_healthy
    environment:
      - EFDI_CERT_DIR=/certs
      - ZENOH_LOCAL_ENDPOINT=${ZENOH_LOCAL_ENDPOINT:-tcp/127.0.0.1:7448}
    command: >
      python3 /app/cot_layer.py
      --host 239.2.3.1
      --port 6969
      --udp
    volumes:
      - ${BUNDLE_DIR:?set BUNDLE_DIR in .env}:/certs:ro
      - ${POD_STATE_DIR}/namespace-prefix:/namespace-prefix:ro
    healthcheck:
      disable: true

  atak-cot-tcp:
    build:
      context: ./bridge
    container_name: efdi-pod-atak-cot-tcp
    network_mode: host
    restart: unless-stopped
    depends_on:
      zenoh-router:
        condition: service_healthy
    environment:
      - EFDI_CERT_DIR=/certs
      - ZENOH_LOCAL_ENDPOINT=${ZENOH_LOCAL_ENDPOINT:-tcp/127.0.0.1:7448}
      - TAK_HOST=${TAK_HOST:-127.0.0.1}
      - TAK_PORT=${TAK_PORT:-8087}
    command: >
      python3 /app/cot_layer.py
      --host ${TAK_HOST:-127.0.0.1}
      --port ${TAK_PORT:-8087}
    volumes:
      - ${BUNDLE_DIR:?set BUNDLE_DIR in .env}:/certs:ro
      - ${POD_STATE_DIR}/namespace-prefix:/namespace-prefix:ro
    healthcheck:
      disable: true

  cat62-bridge:
    build:
      context: ./bridge
    container_name: efdi-pod-cat62-bridge
    network_mode: host
    restart: unless-stopped
    depends_on:
      zenoh-router:
        condition: service_healthy
    environment:
      - EFDI_CERT_DIR=/certs
      - ZENOH_LOCAL_ENDPOINT=${ZENOH_LOCAL_ENDPOINT:-tcp/127.0.0.1:7448}
      - RADAR_HOST=${RADAR_HOST:-127.0.0.1}
      - RADAR_PORT=${RADAR_PORT:-30002}
    command: >
      python3 /app/cat62_layer.py
      --radar-host ${RADAR_HOST:-127.0.0.1}
      --radar-port ${RADAR_PORT:-30002}
    volumes:
      - ${BUNDLE_DIR:?set BUNDLE_DIR in .env}:/certs:ro
      - ${POD_STATE_DIR}/namespace-prefix:/namespace-prefix:ro
    healthcheck:
      disable: true
    profiles:
      - radar

  sitaware-nvg-bridge:
    build:
      context: ./bridge
    container_name: efdi-pod-sitaware-nvg-bridge
    network_mode: host
    restart: unless-stopped
    depends_on:
      zenoh-router:
        condition: service_healthy
    environment:
      - EFDI_CERT_DIR=/certs
      - ZENOH_LOCAL_ENDPOINT=${ZENOH_LOCAL_ENDPOINT:-tcp/127.0.0.1:7448}
      - SITAWARE_URL=${SITAWARE_URL:-}
      - SITAWARE_USER=${SITAWARE_USER:-}
      - SITAWARE_PASS=${SITAWARE_PASS:-}
      - SITAWARE_SOURCE=${SITAWARE_SOURCE:-efdi-live}
    command: >
      python3 /app/nato_nvg_layer.py
      --url ${SITAWARE_URL:-}
      --user ${SITAWARE_USER:-}
      --password ${SITAWARE_PASS:-}
      --source ${SITAWARE_SOURCE:-efdi-live}
    volumes:
      - ${BUNDLE_DIR:?set BUNDLE_DIR in .env}:/certs:ro
      - ${POD_STATE_DIR}/namespace-prefix:/namespace-prefix:ro
    healthcheck:
      disable: true
    profiles:
      - sitaware

  zenoh-admin-db:
    image: postgres:16-alpine
    container_name: efdi-pod-zenoh-admin-db
    network_mode: host
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${ZENOH_ADMIN_DB_USER:?set ZENOH_ADMIN_DB_USER in .env}
      - POSTGRES_PASSWORD=${ZENOH_ADMIN_DB_PASSWORD:?set ZENOH_ADMIN_DB_PASSWORD in .env}
      - POSTGRES_DB=admin
      - PGPORT=${ZENOH_ADMIN_DB_PORT:-5433}
    volumes:
      - ${POD_STATE_DIR}/zenoh-admin/pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ZENOH_ADMIN_DB_USER:-zenoh_admin} -p ${ZENOH_ADMIN_DB_PORT:-5433}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Scoped Docker API access for zenoh-admin: CONTAINERS+POST only (needed for
  # container.get()/.restart() on the zenoh-router container), everything else
  # (IMAGES, NETWORKS, VOLUMES, EXEC, BUILD, SECRETS, SWARM, ...) denied — so a
  # bug in the network-reachable admin API can't reach the full Docker Engine
  # API (container-create with host binds, exec into other containers, etc)
  # the way a raw /var/run/docker.sock mount would allow. Loopback-only.
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:0.2.0
    container_name: efdi-pod-docker-socket-proxy
    restart: unless-stopped
    environment:
      - CONTAINERS=1
      - POST=1
      - IMAGES=0
      - NETWORKS=0
      - VOLUMES=0
      - EXEC=0
      - BUILD=0
      - COMMIT=0
      - CONFIGS=0
      - DISTRIBUTION=0
      - INFO=1
      - NODES=0
      - PLUGINS=0
      - SECRETS=0
      - SERVICES=0
      - SESSION=0
      - SWARM=0
      - SYSTEM=0
      - TASKS=0
      - VERSION=1
      - AUTH=0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "127.0.0.1:2375:2375"
    healthcheck:
      disable: true

  zenoh-admin:
    build:
      context: ./zenoh-admin
    container_name: efdi-pod-zenoh-admin
    network_mode: host
    restart: unless-stopped
    depends_on:
      zenoh-router:
        condition: service_healthy
      zenoh-admin-db:
        condition: service_healthy
      docker-socket-proxy:
        condition: service_started
    environment:
      - EFDI_CERT_DIR=/certs
      - PARTNER_NAMESPACE=${PARTNER_NAMESPACE}
      - ZENOH_LOCAL_ENDPOINT=${ZENOH_ADMIN_ZENOH_ENDPOINT:-tcp/127.0.0.1:7448}
      - ZENOH_CONFIG_PATH=/zenoh-config/config.json5
      - ZENOH_TEMPLATE_PATH=/zenoh-config-template/zenoh-router.json5.tmpl
      - ZENOH_ADMIN_DB_USER=${ZENOH_ADMIN_DB_USER:?set ZENOH_ADMIN_DB_USER in .env}
      - ZENOH_ADMIN_DB_PASSWORD=${ZENOH_ADMIN_DB_PASSWORD:?set ZENOH_ADMIN_DB_PASSWORD in .env}
      - ZENOH_ADMIN_DB_ADDRESS=127.0.0.1:${ZENOH_ADMIN_DB_PORT:-5433}
      - ZENOH_ADMIN_SECRET_KEY=${ZENOH_ADMIN_SECRET_KEY:?set ZENOH_ADMIN_SECRET_KEY in .env}
      - ZENOH_ADMIN_FIRST_USER=${ZENOH_ADMIN_FIRST_USER:-admin}
      - ZENOH_ADMIN_FIRST_PASS=${ZENOH_ADMIN_FIRST_PASS:-}
      - ZENOH_ADMIN_TRUSTED_PARENT_CERT_PATH=${ZENOH_ADMIN_TRUSTED_PARENT_CERT_PATH:-}
      - ZENOH_ADMIN_TRUSTED_PARENT_CN=${ZENOH_ADMIN_TRUSTED_PARENT_CN:-}
      - ZENOH_ADMIN_TRUSTED_ROOT_CERT_PATHS=${ZENOH_ADMIN_TRUSTED_ROOT_CERT_PATHS:-}
      - ZENOH_ADMIN_TRUSTED_ROOT_CNS=${ZENOH_ADMIN_TRUSTED_ROOT_CNS:-}
      - ZENOH_ADMIN_DEV_CORS_ORIGIN=${ZENOH_ADMIN_DEV_CORS_ORIGIN:-}
      - ZENOH_ROUTER_CONTAINER=${ZENOH_ROUTER_CONTAINER:-efdi-pod-zenoh-router}
      - DOCKER_HOST=tcp://127.0.0.1:2375
    volumes:
      - ${BUNDLE_DIR:?set BUNDLE_DIR in .env}:/certs:ro
      - ${POD_STATE_DIR}/zenoh:/zenoh-config
      - ../host/zenoh-router.json5.tmpl:/zenoh-config-template/zenoh-router.json5.tmpl:ro
      - ${POD_STATE_DIR}/zenoh-admin-data:/data
      - ${POD_STATE_DIR}/namespace-prefix:/namespace-prefix:rw
    healthcheck:
      disable: true

  zenoh-admin-proxy:
    image: caddy:2-alpine
    container_name: efdi-pod-zenoh-admin-proxy
    network_mode: host
    restart: unless-stopped
    depends_on:
      - zenoh-admin
    volumes:
      - ./zenoh-admin/Caddyfile:/etc/caddy/Caddyfile:ro
      - zenoh_admin_caddy_data:/data
    healthcheck:
      disable: true

volumes:
  zenoh_admin_caddy_data:
