# EFDI — throwaway THIRD pod ("grandchild") for testing a two-hop hierarchy
# the primary pod defined in docker-compose.yml, on this SAME host. Not part
# of the normal deployment — only zenoh-router + zenoh-admin + its own DB are
# stood up (no bridges, no Caddy — hit zenoh-admin's port directly for testing).
# Shares the primary pod's docker-socket-proxy (compose/docker-compose.yml) —
# scoped Docker API access, container-name-agnostic, no reason to duplicate it.
#
# Usage:
#   export BUNDLE_DIR="$(pwd)/certs" POD_STATE_DIR="$(pwd)/state-child"
#   docker compose -f docker-compose.child.yml up -d --build

services:
  zenoh-router-child:
    image: eclipse/zenoh:1.9.0@sha256:157965d71e0bfd0a044d76a985ff0e5c306ad3968929168fb9678cd2a7fec23f
    container_name: efdi-gc-zenoh-router
    network_mode: host
    restart: unless-stopped
    environment:
      - RUST_LOG=${ZENOH_LOG:-info}
    volumes:
      - ${POD_STATE_DIR:?set in shell env}/zenoh/config.json5:/etc/zenoh/config.json5:ro
      - ${POD_STATE_DIR}/zenoh/tls:/etc/zenoh/tls:ro
      - ${POD_STATE_DIR}/zenoh/rocksdb:/var/lib/zenoh/rocksdb
    command: ["-c", "/etc/zenoh/config.json5"]
    healthcheck:
      test: ["CMD-SHELL", "true"]
      interval: 15s
      timeout: 5s
      retries: 5

  zenoh-admin-db-child:
    image: mariadb:11.4.12-noble@sha256:a794d9eb009e20de605858a11f32f63b4075cbd197c650436f0e3b457e4caed7
    container_name: efdi-gc-zenoh-admin-db
    network_mode: host
    restart: unless-stopped
    command:
      - --bind-address=127.0.0.1
      - --port=${ZENOH_ADMIN_DB_PORT_GRANDCHILD:-3309}
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_bin
      - --default-time-zone=+00:00
      - --transaction-isolation=READ-COMMITTED
    environment:
      - MARIADB_ROOT_PASSWORD=${ZENOH_ADMIN_DB_ROOT_PASSWORD_GRANDCHILD:?set ZENOH_ADMIN_DB_ROOT_PASSWORD_GRANDCHILD}
      - MARIADB_ROOT_HOST=localhost
      - MARIADB_DATABASE=admin
      - MARIADB_USER=${ZENOH_ADMIN_DB_USER_GRANDCHILD:?set ZENOH_ADMIN_DB_USER_GRANDCHILD}
      - MARIADB_PASSWORD=${ZENOH_ADMIN_DB_PASSWORD_GRANDCHILD:?set ZENOH_ADMIN_DB_PASSWORD_GRANDCHILD}
    volumes:
      - ${POD_STATE_DIR}/zenoh-admin/mariadb:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  zenoh-admin-child:
    build:
      context: ./zenoh-admin
      target: runtime
    container_name: efdi-gc-zenoh-admin
    network_mode: host
    restart: unless-stopped
    # docker-socket-proxy lives in the primary pod's docker-compose.yml project
    # and is already running (shared, container-agnostic) — not declared here
    # since a depends_on can't cross compose files/projects.
    depends_on:
      zenoh-router-child:
        condition: service_healthy
      zenoh-admin-db-child:
        condition: service_healthy
    # Dockerfile CMD hardcodes 127.0.0.1:8895 (the primary pod's zenoh-admin
    # already holds that port on this shared host) — bind a different loopback
    # port for the child instead.
    command: ["uvicorn", "api.main:app", "--host", "127.0.0.1", "--port", "8897"]
    environment:
      - EFDI_CERT_DIR=${EFDI_CERT_DIR:-/certs/efdi}
      - EFDI_CERT_HOST_DIR=${BUNDLE_DIR:-}
      - PARTNER_NAMESPACE=${PARTNER_NAMESPACE_GRANDCHILD:?set PARTNER_NAMESPACE_GRANDCHILD}
      - EFDI_TRUST_DOMAIN=${EFDI_TRUST_DOMAIN:-efdi.global}
      - NAMESPACE_PREFIX_FILE=/namespace-prefix
      - ZENOH_LOCAL_ENDPOINT=tcp/127.0.0.1:${ZENOH_LOCAL_TCP_PORT_GRANDCHILD:-7468}
      - ZENOH_CONFIG_PATH=/zenoh-config/config.json5
      - ZENOH_TEMPLATE_PATH=/zenoh-config-template/zenoh-router.json5.tmpl
      - ZENOH_ADMIN_DB_USER=${ZENOH_ADMIN_DB_USER_GRANDCHILD:?set ZENOH_ADMIN_DB_USER_GRANDCHILD}
      - ZENOH_ADMIN_DB_PASSWORD=${ZENOH_ADMIN_DB_PASSWORD_GRANDCHILD:?set ZENOH_ADMIN_DB_PASSWORD_GRANDCHILD}
      - ZENOH_ADMIN_DB_ADDRESS=127.0.0.1:${ZENOH_ADMIN_DB_PORT_GRANDCHILD:-3309}
      - ZENOH_ADMIN_SECRET_KEY=${ZENOH_ADMIN_SECRET_KEY_GRANDCHILD:?set ZENOH_ADMIN_SECRET_KEY_GRANDCHILD}
      - ZENOH_ADMIN_FIRST_USER=${ZENOH_ADMIN_FIRST_USER_GRANDCHILD:-admin}
      - ZENOH_ADMIN_FIRST_PASS=${ZENOH_ADMIN_FIRST_PASS_GRANDCHILD:-}
      - ZENOH_ADMIN_TRUSTED_PARENT_CERT_PATH=${ZENOH_ADMIN_TRUSTED_PARENT_CERT_PATH_GRANDCHILD:-/dev/null}
      - ZENOH_ADMIN_TRUSTED_PARENT_CN=${ZENOH_ADMIN_TRUSTED_PARENT_CN_GRANDCHILD:-}
      - EFDI_PARENT_NAMESPACE=${EFDI_PARENT_NAMESPACE_GRANDCHILD:-}
      - EFDI_ROUTER_CA_PUBLIC_PATH=/certs/router-ca-cert.pem
      - EFDI_POLICY_SIGNER_CERT_PATH=/certs/policy-signer-cert.pem
      - EFDI_POLICY_SIGNER_KEY_PATH=/certs/policy-signer-key.pem
      - EFDI_LINK_SECRET_PATH=/zenoh-config/link-credentials.json
      - EFDI_TRUST_BOOTSTRAP_PATH=/certs/efdi/trust/managed-bootstrap.json
      # This pod's OWN router container (see child compose for rationale).
      - ZENOH_ROUTER_CONTAINER=efdi-gc-zenoh-router
      - DOCKER_HOST=tcp://127.0.0.1:2375
      - EFDI_CONTROL_TOKEN=${EFDI_CONTROL_TOKEN:-}
      - EFDI_SHELL_ENABLED=${EFDI_SHELL_ENABLED_GRANDCHILD:-true}
      - EFDI_RUNTIME_LOG_DIR=/runtime-logs
    volumes:
      - ${BUNDLE_DIR:?set BUNDLE_DIR in shell env}:/certs:ro
      - ${EFDI_ROUTER_CA_CERT_PATH_GRANDCHILD:-/dev/null}:/certs/router-ca-cert.pem:ro
      - ${EFDI_POLICY_SIGNER_CERT_PATH_GRANDCHILD:-/dev/null}:/certs/policy-signer-cert.pem:ro
      - ${EFDI_POLICY_SIGNER_KEY_PATH_GRANDCHILD:-/dev/null}:/certs/policy-signer-key.pem:ro
      - ${POD_STATE_DIR}/zenoh:/zenoh-config
      - ../host/zenoh-router.json5.tmpl:/zenoh-config-template/zenoh-router.json5.tmpl:ro
      - ${POD_STATE_DIR}/zenoh-admin-data:/data
      - ${POD_STATE_DIR}/namespace-prefix:/namespace-prefix:rw
      - ${POD_STATE_DIR}/logs:/runtime-logs:ro
    healthcheck:
      disable: true

networks:
  default:
    name: efdi-gc-default
